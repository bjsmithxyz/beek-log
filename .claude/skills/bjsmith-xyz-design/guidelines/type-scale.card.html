<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div class="r"><span>3xl · 2rem</span><span style="font-size:var(--font-size-3xl);color:var(--color-text-primary)">2rem</span></div>
