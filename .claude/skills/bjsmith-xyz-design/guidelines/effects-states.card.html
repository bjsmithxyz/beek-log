<!-- @dsCard group="Effects" viewport="700x200" name="Interaction states" subtitle="Colour and shadow shift — nothing moves or scales" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px}body::before{display:none}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border:1px solid var(--color-border)}.sw i{display:block;height:52px}.sw b{display:block;padding:4px 6px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;padding:0 6px 5px;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.rows{display:grid;gap:6px}.r{display:grid;grid-template-columns:9rem 1fr;gap:12px;align-items:baseline;font-size:var(--font-size-xs);color:var(--color-text-muted)}
</style></head><body><div class="rows" style="gap:10px">
<div class="r"><span>link</span><span><a href="#" style="font-size:var(--font-size-sm)">accent green → primary text on hover</a></span></div>
<div class="r"><span>row hover</span><span style="font-size:var(--font-size-sm);color:var(--color-text-muted)">background bg-secondary → bg-tertiary, arrow turns accent</span></div>
<div class="r"><span>button hover</span><span style="display:flex;gap:10px"><span style="padding:var(--space-2) var(--space-4);font-size:var(--font-size-sm);color:var(--color-accent-primary);background:var(--color-bg-tertiary);border:1px solid var(--color-accent-primary)">rest</span><span style="padding:var(--space-2) var(--space-4);font-size:var(--font-size-sm);color:var(--color-bg-primary);background:var(--color-accent-primary);border:1px solid var(--color-accent-primary);box-shadow:var(--shadow-hard-accent)">hover</span></span></div>
<div class="r"><span>active / selected</span><span style="display:flex;gap:10px"><span style="padding:var(--space-2) var(--space-3);font-size:var(--font-size-sm);color:var(--color-accent-primary);background:var(--color-bg-tertiary);border:1px solid var(--color-accent-primary);box-shadow:var(--shadow-hard-accent)">[all]</span><span style="padding:var(--space-2) var(--space-3);font-size:var(--font-size-sm);color:var(--color-text-secondary);background:var(--color-bg-secondary);border:1px solid var(--color-border)">[dev]</span></span></div>
<div class="r"><span>focus-visible</span><span style="display:inline-block;padding:4px 8px;font-size:var(--font-size-sm);color:var(--color-text-primary);outline:2px solid var(--color-accent-primary);outline-offset:2px">2px accent, 2px offset</span></div>
</div></body></html>
