<!-- @dsCard group="Type" viewport="700x170" name="Micro labels" subtitle="Uppercase tracking for headers, edges, badges" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px}body::before{display:none}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border:1px solid var(--color-border)}.sw i{display:block;height:52px}.sw b{display:block;padding:4px 6px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;padding:0 6px 5px;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.rows{display:grid;gap:6px}.r{display:grid;grid-template-columns:9rem 1fr;gap:12px;align-items:baseline;font-size:var(--font-size-xs);color:var(--color-text-muted)}
</style></head><body><div class="rows">
<div class="r"><span>label · 0.05em</span><span style="font-size:var(--font-size-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-muted)">type&nbsp;&nbsp;date&nbsp;&nbsp;name&nbsp;&nbsp;description</span></div>
<div class="r"><span>edge · 0.18em</span><span style="font-size:var(--font-size-xs);letter-spacing:.18em;color:var(--color-accent-secondary)">FUJIFILM 400 ▸▸ 1–6</span></div>
<div class="r"><span>frame · 0.1em</span><span style="font-size:var(--font-size-xs);letter-spacing:.1em;color:var(--color-accent-secondary)">12&nbsp;&nbsp;12A</span></div>
<div class="r"><span>path title</span><span style="font-size:var(--font-size-4xl);font-weight:600;color:var(--color-text-primary);line-height:1.1">photos/</span></div>
</div></body></html>
