<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing in use" subtitle="Row padding, panel padding, section rhythm" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px}body::before{display:none}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border:1px solid var(--color-border)}.sw i{display:block;height:52px}.sw b{display:block;padding:4px 6px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;padding:0 6px 5px;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.rows{display:grid;gap:6px}.r{display:grid;grid-template-columns:9rem 1fr;gap:12px;align-items:baseline;font-size:var(--font-size-xs);color:var(--color-text-muted)}
</style></head><body><div style="border:1px solid var(--color-border);background:var(--color-bg-tertiary);padding:var(--space-2) var(--space-4);font-size:var(--font-size-xs);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.05em">list header — space-2 / space-4</div>
<div style="border:1px solid var(--color-border);margin-top:-1px;background:var(--color-bg-secondary);padding:var(--space-3) var(--space-4);font-size:var(--font-size-sm);color:var(--color-text-primary)">row — space-3 / space-4, margin-top −1px</div>
<div style="border:1px solid var(--color-border);margin-top:-1px;background:var(--color-bg-secondary);padding:var(--space-3) var(--space-4);font-size:var(--font-size-sm);color:var(--color-text-primary)">row — borders collapse into one hairline</div>
<div style="margin-top:var(--space-6);border:1px solid var(--color-border);background:var(--color-bg-secondary);box-shadow:var(--shadow-hard);padding:var(--space-4);font-size:var(--font-size-sm);color:var(--color-text-secondary)">panel — space-4 inside, space-6 between sections</div></body></html>
