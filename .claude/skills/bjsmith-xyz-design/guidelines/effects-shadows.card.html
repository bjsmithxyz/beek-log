<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px}body::before{display:none}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border:1px solid var(--color-border)}.sw i{display:block;height:52px}.sw b{display:block;padding:4px 6px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;padding:0 6px 5px;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.rows{display:grid;gap:6px}.r{display:grid;grid-template-columns:9rem 1fr;gap:12px;align-items:baseline;font-size:var(--font-size-xs);color:var(--color-text-muted)}
</style></head><body><div style="display:flex;gap:18px;flex-wrap:wrap">
<div><div style="width:110px;height:48px;background:var(--color-bg-secondary);border:1px solid var(--color-border);box-shadow:var(--shadow-hard)"></div><div style="margin-top:8px;font-size:var(--font-size-xs);color:var(--color-text-muted)">--shadow-hard</div></div><div><div style="width:110px;height:48px;background:var(--color-bg-secondary);border:1px solid var(--color-border);box-shadow:var(--shadow-hard-accent)"></div><div style="margin-top:8px;font-size:var(--font-size-xs);color:var(--color-text-muted)">--shadow-hard-accent</div></div><div><div style="width:110px;height:48px;background:var(--color-bg-secondary);border:1px solid var(--color-border);box-shadow:var(--shadow-hard-amber)"></div><div style="margin-top:8px;font-size:var(--font-size-xs);color:var(--color-text-muted)">--shadow-hard-amber</div></div><div><div style="width:110px;height:48px;background:var(--color-bg-secondary);border:1px solid var(--color-border);box-shadow:var(--shadow-hard-blue)"></div><div style="margin-top:8px;font-size:var(--font-size-xs);color:var(--color-text-muted)">--shadow-hard-blue</div></div><div><div style="width:110px;height:48px;background:var(--color-bg-secondary);border:1px solid var(--color-border);box-shadow:var(--shadow-dialog)"></div><div style="margin-top:8px;font-size:var(--font-size-xs);color:var(--color-text-muted)">--shadow-dialog</div></div>
</div></body></html>
