<!-- @dsCard group="Brand" viewport="700x160" name="Grid texture" subtitle="24px line grid at 15% behind every page" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px}body::before{display:none}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border:1px solid var(--color-border)}.sw i{display:block;height:52px}.sw b{display:block;padding:4px 6px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;padding:0 6px 5px;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.rows{display:grid;gap:6px}.r{display:grid;grid-template-columns:9rem 1fr;gap:12px;align-items:baseline;font-size:var(--font-size-xs);color:var(--color-text-muted)}
</style></head><body><div style="position:relative;height:118px;border:1px solid var(--color-border);background:var(--color-bg-primary);overflow:hidden">
<div style="position:absolute;inset:0;background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);background-size:24px 24px;opacity:.15"></div>
<div style="position:relative;padding:12px;font-size:var(--font-size-sm);color:var(--color-text-secondary)">body::before — fixed, pointer-events none, z-index 0.<br><span style="color:var(--color-text-muted);font-size:var(--font-size-xs)">Never scrolls. Content sits on z-index 1.</span></div>
</div></body></html>
