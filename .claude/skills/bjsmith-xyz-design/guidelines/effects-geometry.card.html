<!-- @dsCard group="Effects" viewport="700x150" name="Geometry" subtitle="Zero radius, 1px borders, 3px accent rules" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px}body::before{display:none}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border:1px solid var(--color-border)}.sw i{display:block;height:52px}.sw b{display:block;padding:4px 6px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;padding:0 6px 5px;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.rows{display:grid;gap:6px}.r{display:grid;grid-template-columns:9rem 1fr;gap:12px;align-items:baseline;font-size:var(--font-size-xs);color:var(--color-text-muted)}
</style></head><body><div style="display:flex;gap:14px;align-items:stretch">
<div style="flex:1;padding:12px;border:1px solid var(--color-border);background:var(--color-bg-secondary);font-size:var(--font-size-xs);color:var(--color-text-muted)">--radius: 0<br>every corner, always</div>
<div style="flex:1;padding:12px;border:1px solid var(--color-border);border-left:3px solid var(--color-accent-primary);background:var(--color-bg-secondary);font-size:var(--font-size-xs);color:var(--color-text-muted)">3px accent rule<br>"now" line, timeline spine</div>
<div style="flex:1;padding:12px;border-bottom:1px dotted var(--color-border-strong);font-size:var(--font-size-xs);color:var(--color-text-muted)">1px dotted underline<br>inline facts</div>
</div></body></html>
