<!-- @dsCard group="Colors" viewport="700x160" name="Light theme" subtitle="Warm paper + darkened accents" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px}body::before{display:none}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border:1px solid var(--color-border)}.sw i{display:block;height:52px}.sw b{display:block;padding:4px 6px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;padding:0 6px 5px;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.rows{display:grid;gap:6px}.r{display:grid;grid-template-columns:9rem 1fr;gap:12px;align-items:baseline;font-size:var(--font-size-xs);color:var(--color-text-muted)}
</style></head><body><div data-theme="light" style="padding:12px;background:var(--color-bg-primary)">
<div class="g">
<div class="sw"><i style="background:#f4f4f0"></i><b>--color-bg-primary</b><span>paper</span></div>
<div class="sw"><i style="background:#eaeae4"></i><b>--color-bg-secondary</b><span>panels</span></div>
<div class="sw"><i style="background:#008833"></i><b>--color-accent-primary</b><span>links</span></div>
<div class="sw"><i style="background:#cc7700"></i><b>--color-accent-secondary</b><span>amber</span></div>
<div class="sw"><i style="background:#0066aa"></i><b>--color-accent-tertiary</b><span>cyan</span></div>
</div>
<p style="margin:8px 0 0;font-size:var(--font-size-xs);color:var(--color-text-muted)">Set <code>data-theme="light"</code>; every token above re-resolves. Accents darken for contrast on paper.</p></div></body></html>
