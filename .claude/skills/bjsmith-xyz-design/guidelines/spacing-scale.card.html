<!-- @dsCard group="Spacing" viewport="700x230" name="Scale" subtitle="4px base, jumps to 8rem for page bottoms" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:14px}body::before{display:none}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border:1px solid var(--color-border)}.sw i{display:block;height:52px}.sw b{display:block;padding:4px 6px;font-size:var(--font-size-xs);font-weight:var(--font-weight-medium);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw span{display:block;padding:0 6px 5px;font-size:var(--font-size-xs);color:var(--color-text-muted)}
.rows{display:grid;gap:6px}.r{display:grid;grid-template-columns:9rem 1fr;gap:12px;align-items:baseline;font-size:var(--font-size-xs);color:var(--color-text-muted)}
</style></head><body><div class="rows">
<div class="r"><span>--space-1 · 4px</span><span><i style="display:inline-block;height:10px;width:0.25rem;background:var(--color-accent-primary)"></i></span></div><div class="r"><span>--space-2 · 8px</span><span><i style="display:inline-block;height:10px;width:0.5rem;background:var(--color-accent-primary)"></i></span></div><div class="r"><span>--space-3 · 12px</span><span><i style="display:inline-block;height:10px;width:0.75rem;background:var(--color-accent-primary)"></i></span></div><div class="r"><span>--space-4 · 16px</span><span><i style="display:inline-block;height:10px;width:1rem;background:var(--color-accent-primary)"></i></span></div><div class="r"><span>--space-5 · 24px</span><span><i style="display:inline-block;height:10px;width:1.5rem;background:var(--color-accent-primary)"></i></span></div><div class="r"><span>--space-6 · 32px</span><span><i style="display:inline-block;height:10px;width:2rem;background:var(--color-accent-primary)"></i></span></div><div class="r"><span>--space-8 · 48px</span><span><i style="display:inline-block;height:10px;width:3rem;background:var(--color-accent-primary)"></i></span></div><div class="r"><span>--space-10 · 64px</span><span><i style="display:inline-block;height:10px;width:4rem;background:var(--color-accent-primary)"></i></span></div><div class="r"><span>--space-16 · 128px</span><span><i style="display:inline-block;height:10px;width:8rem;background:var(--color-accent-primary)"></i></span></div>
</div></body></html>
