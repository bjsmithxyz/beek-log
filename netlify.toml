[build]
  command = "npm run build"
  publish = "dist"
  # Always build. A path-based skip raced with Netlify's "cancel in-progress on
  # newer push" behavior: an admin-only commit could cancel a content build and
  # then skip itself, leaving production stuck on an older commit. Flat
  # production credits make the extra admin-only rebuilds acceptable. Build
  # hooks (nightly travel refresh and the Actions safety net) also need a build
  # even when no files changed — travel publishability is decided at build time.
  ignore = "exit 1"

[build.environment]
  # Astro 7 requires Node >= 22.12; tests require Node >= 22.18
  NODE_VERSION = "22"

# Preserve the retired travel subdomain while moving the public app under the
# main site's /travel path. The explicit full URL keeps the path prefix intact.
[[redirects]]
  from = "https://travel.bjsmith.xyz/*"
  to = "https://bjsmith.xyz/travel/:splat"
  status = 301
  force = true

# Redirects and headers
#
# One policy for every route. A per-route CSP cannot work here: ClientRouter
# swaps documents without a navigation, so the browser keeps enforcing the CSP
# of whichever page was loaded first. Scoping the map origins to /travel meant
# arriving there from any internal link blocked every tile, while a direct hit
# worked — so the narrower policy bought no real protection and broke the page.
# scripts/netlify-config.test.mjs keeps this in sync with what
# src/scripts/travel-client.js actually requests.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    # 'unsafe-inline' remains for Astro's theme bootstrap, ClientRouter, and
    # scoped styles. Nonces are not available on static Netlify headers, so
    # XSS is contained at the content layer instead: travel JSON escapes `<`,
    # markdown HTML is rehype-sanitized, and work URLs are http(s)-only.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Hashed build assets are immutable
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Enable image CDN transformations
[images]
  remote_images = []

# 404 handling: Netlify serves /404.html for unmatched routes automatically;
# an explicit /* redirect breaks dev-server route emulation, so don't add one.
