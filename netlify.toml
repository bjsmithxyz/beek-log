[build]
  command = "npm run build"
  publish = "dist"
  # Every PR must receive its own reviewable Deploy Preview. Comparing only to
  # Netlify's cached commit can incorrectly cancel a deletion preview when the
  # resulting tree matches an older cache. Outside Deploy Previews, admin-only
  # commits may still skip the public build.
  ignore = 'if [ "$CONTEXT" = "deploy-preview" ]; then exit 1; fi; if [ -z "$CACHED_COMMIT_REF" ] || [ -z "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- src public shared scripts astro.config.mjs netlify.toml package.json package-lock.json tsconfig.json'

[build.environment]
  # Astro 7 requires Node >= 22.12; tests require Node >= 22.18
  NODE_VERSION = "22"

# Preserve the retired travel subdomain while moving the public app under the
# main site's /travel path. The explicit full URL keeps the path prefix intact.
[[redirects]]
  from = "https://travel.bjsmith.xyz/*"
  to = "https://bjsmith.xyz/travel/:splat"
  status = 301
  force = true

# Preserve the retired travel project's work-post permalink after reframing
# the entry around this site as a whole.
[[redirects]]
  from = "/work/the-long-way-round/"
  to = "/work/bjsmith-xyz/"
  status = 301

# Redirects and headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    # 'unsafe-inline' is required for Astro's inline theme/view-transition
    # scripts and inlined styles; acceptable on a fully static site.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Travel alone needs external map tiles and live weather. Repeat the complete
# policy so the site-wide rule stays unchanged for every other route.
[[headers]]
  for = "/travel"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self'; connect-src 'self' https://archive-api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/travel/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.basemaps.cartocdn.com; font-src 'self'; connect-src 'self' https://archive-api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Hashed build assets are immutable
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Enable image CDN transformations
[images]
  remote_images = []

# 404 handling: Netlify serves /404.html for unmatched routes automatically;
# an explicit /* redirect breaks dev-server route emulation, so don't add one.
