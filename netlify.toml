[build]
  publish = "."
  functions = "netlify/functions"

# Env values are injected into function bundles and some (repo name, username)
# also appear in committed docs/code — omit from secrets scan to avoid false fails.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_CLIENT_ID,GITHUB_CLIENT_SECRET,SESSION_SECRET,GITHUB_REPO,GITHUB_BRANCH,OAUTH_ALLOWED_USERS,SITE_URL,TRIPS_PATH"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://unpkg.com https://*.basemaps.cartocdn.com; connect-src 'self' https://archive-api.open-meteo.com https://geocoding-api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
